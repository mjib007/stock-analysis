<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股個股分析總覽｜Jackie's Stock Analysis</title>
<style>
  :root{
    --ink:#1c2430; --sub:#5b6472; --line:#e3e7ec; --paper:#fbfaf7;
    --blue:#2456a6; --blue-bg:#eaf1fb; --accent:#b9770e;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6;}
  .wrap{max-width:980px;margin:0 auto;padding:36px 20px 80px;}
  header{border-bottom:3px solid var(--ink);padding-bottom:16px;margin-bottom:24px;}
  header .tag{font-size:12px;letter-spacing:.15em;color:var(--sub);}
  header h1{font-size:26px;margin:6px 0 8px;font-family:"Noto Serif TC",serif;}
  header p{font-size:13.5px;color:var(--sub);margin:4px 0;}
  header .badges img{height:20px;margin-right:4px;vertical-align:middle;}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 22px;align-items:center;}
  #search{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;
    font-size:14px;font-family:inherit;background:#fff;}
  .chip{padding:6px 14px;border:1px solid var(--line);border-radius:20px;background:#fff;
    font-size:12.5px;cursor:pointer;color:var(--sub);user-select:none;}
  .chip.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  .sortbtn{font-size:12.5px;color:var(--sub);cursor:pointer;text-decoration:underline;margin-left:auto;}

  .count{font-size:12.5px;color:var(--sub);margin-bottom:10px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px;
    text-decoration:none;color:inherit;display:block;transition:box-shadow .15s, transform .15s;}
  .card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-1px);}
  .card .ticker{font-size:11.5px;font-weight:700;color:var(--blue);background:var(--blue-bg);
    display:inline-block;padding:2px 8px;border-radius:4px;margin-bottom:8px;}
  .card .ticker.special{color:var(--accent);background:#fdf3e1;}
  .card h3{font-size:15px;margin:0 0 10px;font-family:"Noto Serif TC",serif;line-height:1.4;}
  .card .date{font-size:11.5px;color:var(--sub);}
  .card .visits{margin-top:8px;}
  .card .visits img{height:18px;opacity:0.85;vertical-align:middle;}

  .empty{padding:40px 0;text-align:center;color:var(--sub);font-size:13.5px;display:none;}

  .foot{font-size:12px;color:var(--sub);border-top:1px solid var(--line);
    margin-top:44px;padding-top:16px;}
  .foot a{color:var(--blue);}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="tag">STOCK ANALYSIS ARCHIVE</div>
  <img src="https://visitor-badge.laobi.icu/badge?page_id=mjib007.stock-analysis.index" alt="Visitors" style="margin-bottom:8px;opacity:0.85;">
  <h1>📊 台股個股分析總覽</h1>
  <p>依「現金流優先、基本面在後」六步驟框架整理的個股分析報告集，每份報告皆附資料來源頁碼與查證連結。</p>
  <p style="font-size:12px;">⚠️ 這是分析方法論與個人研究紀錄，不是投資建議。<a href="README.md" style="color:var(--blue);">框架說明 README →</a></p>
</header>

<div class="controls">
  <input id="search" type="text" placeholder="搜尋股票代號或公司名稱…">
  <span class="chip active" data-filter="all">全部</span>
  <span class="chip" data-filter="analysis">個股分析</span>
  <span class="chip" data-filter="special">特別事件</span>
  <span class="sortbtn" id="sortToggle">依日期排序 ↓</span>
</div>

<div class="count" id="count"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty">沒有符合的結果</div>

<div class="foot">
  資料每次 <code>git push</code> 後由本頁自動反映（依 commit 紀錄），共 <span id="totalCount"></span> 份報告。<br>
  <a href="https://github.com/mjib007/stock-analysis">回到 GitHub Repo</a>　｜　<a href="LICENSE">CC BY-NC 4.0</a>（姓名標示－非商業性）
</div>

</div>

<script>
const REPORTS = [
  {ticker:"1560", name:"中砂", title:"中砂 1560｜台股個股初步分析", file:"reports/1560_cgw_analysis.html", date:"2026-08-03", type:"analysis", pageId:"1560"},
  {ticker:"2327", name:"國巨", title:"2327 國巨｜現金流量表六大規則分析", file:"reports/2327_yageo_analysis.html", date:"2026-07-31", type:"analysis", pageId:"2327"},
  {ticker:"2327", name:"國巨（更新版）", title:"國巨 2327 個股初步分析（更新版）", file:"reports/2327_yageo_analysis_20260801.html", date:"2026-08-01", type:"analysis", pageId:"2327v2"},
  {ticker:"2330", name:"台積電", title:"2330 台積電｜現金流量表六大規則分析", file:"reports/2330_analysis.html", date:"2026-07-25", type:"analysis", pageId:"2330"},
  {ticker:"2352", name:"佳世達", title:"佳世達 (2352) 個股分析報告", file:"reports/qisda_2352.html", date:"2026-07-25", type:"analysis", pageId:"2352"},
  {ticker:"2492", name:"華新科", title:"華新科（2492）初步分析｜現金流量表六大規則", file:"reports/2492_walsin_analysis.html", date:"2026-07-26", type:"analysis", pageId:"2492"},
  {ticker:"2762", name:"世界健身-KY", title:"世界健身-KY（2762）股票初步分析報告", file:"reports/2762_worldgym_analysis.html", date:"2026-07-27", type:"analysis", pageId:"2762"},
  {ticker:"3008", name:"大立光電", title:"3008 大立光電｜台股個股初步分析", file:"reports/3008_largan_analysis.html", date:"2026-08-19", type:"analysis", pageId:"3008"},
  {ticker:"3037", name:"欣興電子", title:"欣興電子 3037｜台股個股初步分析", file:"reports/3037_unimicron_analysis.html", date:"2026-08-06", type:"analysis", pageId:"3037"},
  {ticker:"3260", name:"威剛科技", title:"威剛科技 3260｜台股個股初步分析", file:"reports/3260_adata_analysis.html", date:"2026-07-26", type:"analysis", pageId:"3260"},
  {ticker:"3711", name:"日月光投控", title:"3711 日月光投控｜台股初步分析", file:"reports/3711_ase_analysis.html", date:"2026-08-09", type:"analysis", pageId:"3711"},
  {ticker:"6239", name:"力成科技", title:"力成科技(6239) 2026年第二季財報分析", file:"reports/6239_powertech_analysis.html", date:"2026-08-10", type:"analysis", pageId:"6239"},
  {ticker:"6446", name:"藥華藥 × AOP", title:"藥華藥 × AOP 國際仲裁案時間軸", file:"reports/6446_aop_arbitration_timeline.html", date:"2026-08-09", type:"special", pageId:"6446-aop-arbitration"},
  {ticker:"7769", name:"鴻勁精密", title:"7769 鴻勁精密｜台股初步分析", file:"reports/7769_hongjin_analysis.html", date:"2026-08-08", type:"analysis", pageId:"7769"},
  {ticker:"7823", name:"奧義賽博科技", title:"7823 奧義賽博科技 115年Q1 獲利來源與虧損原因分析", file:"reports/7823_cycraft_analysis.html", date:"2026-08-08", type:"analysis", pageId:"7823_cycraft_analysis"},
  {ticker:"5904", name:"寶雅生活館", title:"寶雅 5904｜台股個股初步分析（六步驟完成）", file:"reports/5904_poya_analysis.html", date:"2026-08-15", type:"analysis", pageId:"5904"},
  {ticker:"0050×00881", name:"0050 vs 00881", title:"0050 vs 00881｜成分股結構與波動性比較", file:"reports/0050_vs_00881_comparison.html", date:"2026-08-22", type:"special", pageId:"0050vs00881"},
  {ticker:"00737×00851×00762", name:"三檔AI/機器人ETF", title:"00737 vs 00851 vs 00762｜AI／機器人主題ETF成分股比較", file:"reports/00737_00851_00762_ai_robot_etf_comparison.html", date:"2026-08-23", type:"special", pageId:"00737-00851-00762-comparison"},
];

let sortDesc = true;
let activeFilter = "all";

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const countEl = document.getElementById('count');
document.getElementById('totalCount').textContent = REPORTS.length;

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let items = REPORTS.filter(r => {
    const matchQ = !q || r.ticker.toLowerCase().includes(q) || r.name.toLowerCase().includes(q) || r.title.toLowerCase().includes(q);
    const matchF = activeFilter === "all" || r.type === activeFilter;
    return matchQ && matchF;
  });
  items.sort((a,b) => sortDesc ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));

  grid.innerHTML = items.map(r => `
    <a class="card" href="${r.file}">
      <span class="ticker ${r.type==='special'?'special':''}">${r.ticker}｜${r.name}</span>
      <h3>${r.title}</h3>
      <div class="date">最後更新：${r.date}</div>
      <div class="visits"><img src="https://visitor-badge.laobi.icu/badge?page_id=mjib007.stock-analysis.${r.pageId}" alt="瀏覽次數"></div>
    </a>
  `).join('');

  countEl.textContent = `共 ${items.length} 份報告`;
  empty.style.display = items.length ? 'none' : 'block';
}

document.getElementById('search').addEventListener('input', render);
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.filter;
    render();
  });
});
document.getElementById('sortToggle').addEventListener('click', (e) => {
  sortDesc = !sortDesc;
  e.target.textContent = sortDesc ? '依日期排序 ↓' : '依日期排序 ↑';
  render();
});

render();
</script>
</body>
</html>
